name: Deploy ke Server Kampus

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 1821 -H krbai.pens.ac.id >> ~/.ssh/known_hosts

      - name: Deploy Files to Server
        run: |
          rsync -avz -e "ssh -p 1821" --exclude 'node_modules' --exclude '.git' --exclude '.github' ./ root@krbai.pens.ac.id:/var/www/html/profile-emosver-team/
