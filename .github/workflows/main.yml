      - name: Fix Laravel permissions
        run: |
          ssh -p 1821 root@krbai.pens.ac.id "
            cd /var/www/laravel &&

            echo '========================================'
            echo '       DETECT PHP USER'
            echo '========================================'

            PHP_USER=\$(ps aux | grep '[p]hp-fpm' | awk 'NR==1 {print \$1}')

            if [ -z \"\$PHP_USER\" ]; then
              echo 'PHP-FPM user tidak terdeteksi.'
              echo 'Menggunakan www-data sebagai fallback.'
              PHP_USER=www-data
            fi

            echo \"PHP USER: \$PHP_USER\"

            echo ''
            echo '========================================'
            echo '       PERMISSION SEBELUM'
            echo '========================================'

            stat -c '%U:%G %a %n' \
              storage \
              storage/framework \
              storage/framework/views \
              bootstrap/cache

            echo ''
            echo '========================================'
            echo '       FIX PERMISSION'
            echo '========================================'

            chown -R \$PHP_USER:\$PHP_USER storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            echo ''
            echo '========================================'
            echo '       CLEAR CACHE'
            echo '========================================'

            php artisan optimize:clear

            echo ''
            echo '========================================'
            echo '       TEST WRITE'
            echo '========================================'

            TEST_FILE=\"storage/framework/views/.deploy-test\"

            echo 'deployment test' > \"\$TEST_FILE\"

            if [ -f \"\$TEST_FILE\" ]; then
              echo 'SUCCESS: Laravel storage bisa ditulis'
              rm -f \"\$TEST_FILE\"
            else
              echo 'ERROR: storage tidak bisa ditulis'
              exit 1
            fi

            echo ''
            echo '========================================'
            echo '       PERMISSION SESUDAH'
            echo '========================================'

            stat -c '%U:%G %a %n' \
              storage \
              storage/framework \
              storage/framework/views \
              bootstrap/cache

            echo ''
            echo 'DEPLOY SELESAI'
          "
