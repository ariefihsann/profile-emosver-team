name: Deploy ke Server Kampus

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Ambil source code dari GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Pasang SSH private key
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3. Tambahkan server ke known_hosts
      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 1821 -H krbai.pens.ac.id >> ~/.ssh/known_hosts

      # 4. Upload source code ke server
      - name: Deploy files with rsync
        run: |
          rsync -avz \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='storage/' \
            -e "ssh -p 1821" \
            ./ root@krbai.pens.ac.id:/var/www/laravel/

      # 5. Fix permission Laravel
      - name: Fix Laravel permissions
        run: |
          ssh -p 1821 root@krbai.pens.ac.id '
            set -e

            cd /var/www/laravel

            echo "========================================"
            echo "       DETECT PHP USER"
            echo "========================================"

            PHP_USER=$(ps -eo user,comm | awk '\''$2 ~ /^php-fpm/ {print $1; exit}'\'')

            if [ -z "$PHP_USER" ]; then
              echo "PHP-FPM user tidak terdeteksi."
              echo "Menggunakan www-data."
              PHP_USER=www-data
            fi

            echo "PHP USER: $PHP_USER"

            echo ""
            echo "========================================"
            echo "       PERMISSION SEBELUM"
            echo "========================================"

            stat -c "%U:%G %a %n" \
              storage \
              storage/framework \
              storage/framework/views \
              bootstrap/cache

            echo ""
            echo "========================================"
            echo "       FIX PERMISSION"
            echo "========================================"

            chown -R "$PHP_USER:$PHP_USER" storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            echo ""
            echo "========================================"
            echo "       CLEAR LARAVEL CACHE"
            echo "========================================"

            php artisan optimize:clear

            echo ""
            echo "========================================"
            echo "       TEST WRITE STORAGE"
            echo "========================================"

            TEST_FILE="storage/framework/views/.deploy-test"

            echo "deployment test" > "$TEST_FILE"

            if [ -f "$TEST_FILE" ]; then
              echo "SUCCESS: storage/framework/views bisa ditulis"
              rm -f "$TEST_FILE"
            else
              echo "ERROR: storage/framework/views TIDAK bisa ditulis"
              exit 1
            fi

            echo ""
            echo "========================================"
            echo "       PERMISSION SESUDAH"
            echo "========================================"

            stat -c "%U:%G %a %n" \
              storage \
              storage/framework \
              storage/framework/views \
              bootstrap/cache

            echo ""
            echo "========================================"
            echo "       DEPLOY SELESAI"
            echo "========================================"
          '
