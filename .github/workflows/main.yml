  - name: Fix Laravel permissions
    run: |
      ssh -p 1821 root@krbai.pens.ac.id "
        cd /var/www/laravel

        echo '========================================'
        echo '       DETECT PHP USER'
        echo '========================================'

        PHP_USER=\$(ps aux | grep '[p]hp-fpm' | head -1 | awk '{print \$1}')

        if [ -z \"\$PHP_USER\" ]; then
          PHP_USER=www-data
        fi

        echo \"PHP USER: \$PHP_USER\"

        echo ''
        echo '========================================'
        echo '       PERMISSION SEBELUM'
        echo '========================================'

        stat -c '%U:%G %a %n' \
          storage \
          storage/framework \
          storage/framework/views \
          bootstrap/cache

        echo ''
        echo '========================================'
        echo '       FIX PERMISSION'
        echo '========================================'

        chown -R \"\$PHP_USER:\$PHP_USER\" storage bootstrap/cache
        chmod -R 775 storage bootstrap/cache

        echo ''
        echo '========================================'
        echo '       CLEAR LARAVEL CACHE'
        echo '========================================'

        php artisan optimize:clear

        echo ''
        echo '========================================'
        echo '       TEST WRITE STORAGE'
        echo '========================================'

        TEST_FILE='storage/framework/views/.deploy-test'

        echo 'deployment test' > \"\$TEST_FILE\"

        if [ -f \"\$TEST_FILE\" ]; then
          echo 'SUCCESS: storage/framework/views bisa ditulis'
          rm -f \"\$TEST_FILE\"
        else
          echo 'ERROR: storage/framework/views TIDAK bisa ditulis'
          exit 1
        fi

        echo ''
        echo '========================================'
        echo '       PERMISSION SESUDAH'
        echo '========================================'

        stat -c '%U:%G %a %n' \
          storage \
          storage/framework \
          storage/framework/views \
          bootstrap/cache

        echo ''
        echo '========================================'
        echo '       DEPLOY SELESAI'
        echo '========================================'
      "
