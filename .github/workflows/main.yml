name: Deploy ke Server Kampus

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 1821 -H krbai.pens.ac.id >> ~/.ssh/known_hosts

      - name: Deploy Files to Server
        run: |
          rsync -avz -e "ssh -p 1821 -i ~/.ssh/id_ed25519" --exclude 'node_modules' --exclude '.git' --exclude '.github' ./ root@krbai.pens.ac.id:/var/www/html/profile-emosver-team/
